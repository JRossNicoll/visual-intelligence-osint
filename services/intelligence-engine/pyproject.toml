[tool.poetry]
name = "viosint-intelligence-engine"
version = "0.1.0"
description = "VIOSINT Intelligence Engine - Temporal patterns, anomaly detection, risk scoring, predictions"
authors = ["VIOSINT Team"]
readme = "README.md"
packages = [{include = "intelligence_engine"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"
redis = "^5.0.1"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.23"
neo4j = "^5.15.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
