[tool.poetry]
name = "viosint-event-processor"
version = "0.1.0"
description = "VIOSINT Event Processor - Redis Streams consumer for detection events"
authors = ["VIOSINT Team"]
readme = "README.md"
packages = [{include = "event_processor"}]

[tool.poetry.dependencies]
python = "^3.10"
redis = "^5.0.1"
asyncpg = "^0.29.0"
sqlalchemy = {version = "^2.0.23", extras = ["asyncio"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
