[tool.poetry]
name = "viosint-cv-pipeline"
version = "0.1.0"
description = "Visual Intelligence OSINT Platform - Computer Vision Pipeline"
authors = ["VIOSINT Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
ultralytics = "^8.0.0"
opencv-python-headless = "^4.8.0"
numpy = "^1.26.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
open-clip-torch = "^2.24.0"
pillow = "^10.1.0"
httpx = "^0.25.2"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
scipy = "^1.11.0"
filterpy = "^1.4.5"
lapx = ">=0.5.2"
redis = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
