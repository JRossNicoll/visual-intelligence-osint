version: '3.9'

# ============================================================================
# GPU Override for CV Pipeline
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requires: NVIDIA Container Toolkit
# ============================================================================

services:
  cv-pipeline:
    build:
      context: ./services/cv-pipeline
      dockerfile: Dockerfile.gpu
    environment:
      DETECTION_DEVICE: "cuda:0"
      EMBEDDING_DEVICE: "cuda:0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
